name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get icons from site repo
        uses: actions/checkout@v4
        with:
          repository: priyanshuraj834072-eng/signify
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep the same debug key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Install packages
        run: npm install

      - name: Prepare icon files
        run: |
          pip install pillow
          mkdir -p assets
          python - <<'PY'
          from PIL import Image
          src = Image.open('site/icons/icon-maskable-512.png').convert('RGBA')
          big = src.resize((1024, 1024), Image.LANCZOS)
          for n in ('icon-only.png', 'icon-foreground.png', 'icon-background.png'):
              big.save('assets/' + n)
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android || echo "icon step skipped"

      - name: Permissions and version
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' $F
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk singify.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Singify v1.0.${{ github.run_number }}
          files: singify.apk
