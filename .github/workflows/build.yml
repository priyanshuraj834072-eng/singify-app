name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get icons from site repo
        uses: actions/checkout@v4
        with:
          repository: priyanshuraj834072-eng/signify
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: npm install

      - name: Prepare icon and splash files
        run: |
          pip install pillow
          mkdir -p assets
          python - <<'PY'
          from PIL import Image, ImageDraw
          src = Image.open('site/icons/icon-maskable-512.png').convert('RGBA')
          big = src.resize((1024, 1024), Image.LANCZOS)
          for n in ('icon-only.png', 'icon-foreground.png', 'icon-background.png'):
              big.save('assets/' + n)
          D = 1300
          logo = src.resize((D, D), Image.LANCZOS)
          m = Image.new('L', (D * 4, D * 4), 0)
          ImageDraw.Draw(m).ellipse((0, 0, D * 4 - 1, D * 4 - 1), fill=255)
          m = m.resize((D, D), Image.LANCZOS)
          bg = Image.new('RGBA', (2732, 2732), (10, 9, 7, 255))
          bg.paste(logo, ((2732 - D) // 2, (2732 - D) // 2), m)
          bg.convert('RGB').save('assets/splash.png')
          bg.convert('RGB').save('assets/splash-dark.png')
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Generate app icons and splash
        run: npx @capacitor/assets generate --android || echo "assets step skipped"

      - name: Permissions, version and splash colour
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' $F
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's|<style name="AppTheme.NoActionBarLaunch"\([^>]*\)>|&\n        <item name="windowSplashScreenBackground">#0a0907</item>|' android/app/src/main/res/values/styles.xml

      - name: Edge-to-edge bridge (status bar behind the app, opt-in from the site)
        run: |
          J=android/app/src/main/java/com/singify/app/MainActivity.java
          test -f "$J" || { echo "MainActivity.java not found"; find android/app/src -name "MainActivity*"; exit 1; }
          cat > "$J" <<'JAVA'
          package com.singify.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import androidx.core.graphics.Insets;
          import androidx.core.view.OnApplyWindowInsetsListener;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private int statusPx = 0;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              int id = getResources().getIdentifier("status_bar_height", "dimen", "android");
              if (id > 0) statusPx = getResources().getDimensionPixelSize(id);
              getBridge().getWebView().addJavascriptInterface(new EdgeBridge(), "SGEdge");
            }

            public class EdgeBridge {
              @JavascriptInterface
              public float top() {
                return statusPx / getResources().getDisplayMetrics().density;
              }

              @JavascriptInterface
              public void enable(final boolean on) {
                runOnUiThread(new Runnable() {
                  public void run() {
                    setEdge(on);
                  }
                });
              }

              /* colour of the area under the app (behind the gesture / navigation bar) */
              @JavascriptInterface
              public void bar(final String hex, final boolean lightIcons) {
                runOnUiThread(new Runnable() {
                  public void run() {
                    setBar(hex, lightIcons);
                  }
                });
              }
            }

            private void setBar(String hex, boolean lightIcons) {
              try {
                int color = Color.parseColor(hex);
                getWindow().getDecorView().setBackgroundColor(color);
                getWindow().setNavigationBarColor(color);
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                c.setAppearanceLightNavigationBars(lightIcons);
              } catch (Exception e) {
              }
            }

            private void setEdge(boolean on) {
              final View content = findViewById(android.R.id.content);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), !on);
              if (on) {
                getWindow().setStatusBarColor(Color.TRANSPARENT);
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                c.setAppearanceLightStatusBars(false);
                ViewCompat.setOnApplyWindowInsetsListener(content, new OnApplyWindowInsetsListener() {
                  @Override
                  public WindowInsetsCompat onApplyWindowInsets(View v, WindowInsetsCompat insets) {
                    Insets b = insets.getInsets(WindowInsetsCompat.Type.navigationBars() | WindowInsetsCompat.Type.ime());
                    v.setPadding(0, 0, 0, b.bottom);
                    return WindowInsetsCompat.CONSUMED;
                  }
                });
                ViewCompat.requestApplyInsets(content);
              } else {
                ViewCompat.setOnApplyWindowInsetsListener(content, null);
                content.setPadding(0, 0, 0, 0);
              }
            }
          }
          JAVA
          echo "---- MainActivity.java ----"
          head -20 "$J"

      - name: Include Google Sign-In library
        run: |
          grep -q "rgcfaIncludeGoogle" android/variables.gradle || sed -i 's/ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          cat android/variables.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK with the permanent key
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in singify.keystore.enc -out $RUNNER_TEMP/singify.keystore -pass env:PASS
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/singify.keystore --ks-key-alias singify --ks-pass env:PASS --key-pass env:PASS --out singify.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify --print-certs singify.apk | grep -i "SHA-1 digest"
          rm $RUNNER_TEMP/singify.keystore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Singify v1.0.${{ github.run_number }}
          files: singify.apk

      - name: Enable KVM
        if: always()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Crash test on emulator
        if: always()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r singify.apk
            adb logcat -c
            adb shell monkey -p com.singify.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt

      - name: Show crash log
        if: always()
        run: |
          echo "==== FATAL / AndroidRuntime ===="
          grep -A 30 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -80 || true
          echo "==== Caused by ===="
          grep "Caused by" logcat.txt | head -10 || true