name: Create keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create keystore if missing
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then echo "KEYSTORE_PASSPHRASE secret is missing"; exit 1; fi
          if [ ! -f singify.keystore.enc ]; then
            keytool -genkeypair -v -keystore singify.keystore -alias singify -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Singify, O=Singify, C=IN"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in singify.keystore -out singify.keystore.enc -pass env:PASS
            rm singify.keystore
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add singify.keystore.enc
            git commit -m "Add encrypted keystore"
            git push
          else
            echo "Keystore already exists, not changing it"
          fi

      - name: Show fingerprints
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in singify.keystore.enc -out /tmp/k.keystore -pass env:PASS
          keytool -list -v -keystore /tmp/k.keystore -alias singify -storepass "$PASS" | grep -E "SHA1|SHA256"
          rm /tmp/k.keystore
